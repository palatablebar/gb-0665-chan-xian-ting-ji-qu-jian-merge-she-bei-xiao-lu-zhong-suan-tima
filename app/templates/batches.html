{% extends 'base.html' %}
{% block panels %}<section class="panel data-panel"><div class="panel__head"><h2>运行清单</h2><span>OEE / BATCHES</span></div><div class="panel__body flush">{{ table(data.get('history',[]),[('id','运行号'),('revision','修订'),('decision','审核')]) }}</div></section><section class="panel evidence-panel"><div class="panel__head"><h2>裁决依据</h2><span>LOCAL</span></div><div class="panel__body"><div class="readout"><small>SHA256</small><b class="hash">{{ data.manifest.sha256 }}</b><small>耗时 / ms</small><b>{{ data.manifest.elapsed_ms }}</b></div></div></section>{% endblock %}
